name: Keep Streamlit Alive (debug redirects)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set URL (usa la CANÓNICA)
        run: |
          # Usa preferiblemente la URL *.streamlit.app exacta que abre en el navegador sin saltos
          echo "URL=https://quantforall.streamlit.app/" >> $GITHUB_ENV

      - name: Show DNS
        run: |
          host "$(echo "$URL" | sed -E 's#https?://([^/]+)/?.*#\1#')" || true

      - name: Trace redirects (verbose)
        run: |
          set -e
          echo "Tracing: $URL"
          # Guarda toda la sesión HTTP (con -v) para ver redirecciones y Location:
          curl -v -I "$URL" 2>&1 | sed -n '1,120p' || true

      - name: GET with cap on redirects + report
        run: |
          set -e
          MAXR=10
          OUT_HEADERS=resp.headers
          OUT_BODY=resp.body
          STATUS=$(curl \
            --silent --show-error \
            --location --max-redirs "$MAXR" \
            --connect-timeout 15 --max-time 45 \
            --ipv4 \
            --write-out "code=%{http_code}\neffective=%{url_effective}\nredirects=%{num_redirects}\nredir_to=%{redirect_url}\n" \
            --dump-header "$OUT_HEADERS" \
            --output "$OUT_BODY" \
            "$URL")
          echo "---- CURL META ----"
          echo "$STATUS"
          echo "-------------------"
          echo "---- Headers (last hop) ----"
          sed -n '1,80p' "$OUT_HEADERS" || true
          echo "---- First 300 chars of body ----"
          head -c 300 "$OUT_BODY" || true
          echo
          CODE=$(echo "$STATUS" | sed -n 's/^code=\([0-9]*\)$/\1/p')
          REDIRS=$(echo "$STATUS" | sed -n 's/^redirects=\([0-9]*\)$/\1/p')
          if [ "$REDIRS" -ge "$MAXR" ]; then
            echo "❌ Demasiados redireccionamientos (>= $MAXR). Revisa la URL/redirects." >&2
            exit 47
          fi
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
            echo "✅ OK ($CODE), redirects: $REDIRS"
          else
            echo "❌ HTTP $CODE" >&2
            exit 1
          fi
